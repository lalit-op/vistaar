<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08090b">
<title>Vistaar TV</title>
<style>
:root{font-size:1vw;--ink:#f4f5f7;--muted:#a1a6b3;--panel:#101115;--blue:#57a8ff;--line:#26272b;--warm:radial-gradient(ellipse at 80% 54%,#754018 0%,#351c15 32%,#170c12 60%,#09090b 88%)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#08090b;color:var(--ink);overflow:hidden;font:500 1.15rem/1.38 Roboto,Arial,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:#252529;border:0;border-radius:.72rem;padding:.8rem 1.1rem;text-align:center}button:focus{outline:0;background:#f4f5f7!important;color:#111216!important;box-shadow:0 0 0 .12rem #fff;position:relative;z-index:1}button:focus small,button:focus .number{color:#394150}button:disabled{opacity:.5}
[hidden]{display:none!important}h1,h2,h3,p{margin:0}h1,h2,h3,strong{font-weight:600}small,.muted{color:var(--muted)}small{font-size:.97rem}
#app{height:100%;padding:2.8rem 5rem;display:flex;flex-direction:column}
#app.home{background:var(--warm);padding-bottom:0}.home .rail{padding-bottom:1rem}.home #stage{margin-right:-5rem;padding-right:0}#app.setup{background:radial-gradient(ellipse at 15% 4%,#292a2b,transparent 46%),linear-gradient(140deg,#111517,#0a1512 57%,#090a0b)}
header{position:relative;height:3.35rem;flex:none;display:flex;align-items:center;justify-content:space-between;margin-bottom:2.2rem}
.brand{display:inline-flex;align-items:center;font-weight:650;font-size:1.42rem;letter-spacing:-.045rem}
.mark{position:relative;width:1.9rem;height:1.5rem;margin-right:.8rem;display:inline-block}
.mark:before,.mark:after{content:"";position:absolute;top:0;width:.52rem;height:1.45rem;transform:skew(25deg);background:#f5f6f8;left:.43rem}.mark:after{background:var(--blue);transform:skew(-25deg);left:1.14rem;height:1.2rem}
nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;background:#131418e8;border:1px solid var(--line);border-radius:3rem;padding:.24rem}
nav button,.circle{color:var(--muted);background:transparent;border-radius:2rem;font-weight:600;font-size:1.1rem;white-space:nowrap;padding:.62rem 1.23rem}nav button.active{color:white;background:#36373b}
.tools{display:flex;align-items:center}.tools>*{margin-left:.65rem}.circle{width:2.75rem;height:2.75rem;padding:0;background:#15161a;font-size:1.25rem}.clock,.time,.number{font-variant-numeric:tabular-nums}.clock{font-family:monospace;font-size:1.02rem}.searchIcon{display:inline-block;width:.72rem;height:.72rem;border:2px solid currentColor;border-radius:100%;position:relative}.searchIcon:after{content:"";position:absolute;width:.45rem;height:2px;background:currentColor;right:-.36rem;bottom:-.16rem;transform:rotate(45deg)}
main{position:relative;flex:1;min-height:0}#stage{height:100%;overflow:auto}::-webkit-scrollbar{width:0;height:0}
.setup-layout{height:100%;display:grid;grid-template-columns:1fr .94fr;grid-gap:4rem;align-items:center}.setup-layout h1{font-size:3.55rem;line-height:1.09;letter-spacing:-.14rem;margin:1rem 0}.setup-layout p{color:#bdc2ca;max-width:35rem;font-size:1.35rem}.setup-panel,.dialog,.schedule{background:var(--panel);border-radius:1.45rem;padding:2.8rem}.setup-panel,.dialog{border:1px solid var(--line)}.setup-panel h2{font-size:1.7rem}.setup-panel button{width:100%;margin-top:.8rem}.setup-panel small{display:block;margin-top:1.2rem}
.brandline,.badgeline,.actions,.range,.channel,.station,.programme,.filters button{display:flex;align-items:center}.brandline>*+*,.badgeline>*+*,.actions>*+*,.range>*+*{margin-left:.8rem}
.logoBox{width:3rem;height:3rem;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:.65rem;background:#1c2028;color:#e9eef6;position:relative;font-weight:700;font-size:.88rem;overflow:hidden}.logoBox img{position:absolute;inset:0;left:0;top:0;width:100%;height:100%;object-fit:contain;padding:.28rem;background:#1c2028}
.liveTag{display:inline-block;border-radius:.36rem;color:white;background:#eb2438;padding:.08rem .55rem;font-size:.92rem;font-weight:750;line-height:1.3;letter-spacing:.02rem}.homeHero{min-height:32.5rem;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;max-width:60rem}.homeHero h1{font-size:4.05rem;letter-spacing:-.17rem;line-height:1.06;margin:1.25rem 0 .65rem}.homeHero h3{font-size:1.43rem}.homeHero .badgeline{margin-top:.95rem}.description{max-width:38rem;margin:1rem 0;color:#d0d2d8;line-height:1.45}.actions{margin-top:1.3rem}.actions button{font-weight:600}.range{color:var(--muted);font:1rem monospace}.track{display:block;height:.28rem;background:#ffffff36;border-radius:1rem;overflow:hidden;width:100%}.track i{display:block;height:100%;background:var(--blue);border-radius:inherit}.range .track{width:21rem}
.railTitle{font-size:1.5rem;margin:.8rem 0 1rem}.rail{display:flex;overflow-x:auto;padding:.22rem .22rem .8rem}.tile,.art{background:radial-gradient(ellipse at 73% 39%,var(--glow,#7b421e),transparent 65%),linear-gradient(155deg,#34151e,#110c10 85%)}.tile{position:relative;flex:0 0 20.8rem;height:11.65rem;margin-right:.85rem;padding:.9rem;border-radius:.9rem;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.tile:focus{color:white!important;background:radial-gradient(ellipse at 73% 39%,var(--glow),#171015)!important}.tile:focus small{color:#d0d2d8}.tile .logoBox{width:2.5rem;height:2.5rem}.station{min-width:0}.station .words{margin-left:.75rem}.words{min-width:0;text-align:left}.words strong,.words small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1.pageTitle{font-size:2.45rem;letter-spacing:-.07rem;margin:0 0 1.2rem}.browser{height:100%;display:grid;grid-template-columns:17.4% 41.5% minmax(0,1fr);grid-gap:2rem}.list,.filters,.schedule{min-height:0;overflow:auto;padding:.3rem}.filters button{justify-content:space-between;width:100%;background:transparent;color:var(--muted);margin:0 0 .22rem;padding:.95rem 1rem;text-align:left}.filters button.active,.channel.selected{background:#2a2b2f;color:#f4f5f7}.channel{width:100%;min-height:5.18rem;background:transparent;text-align:left;padding:.7rem 1rem;margin:0 0 .21rem}.channel .number{color:var(--muted);min-width:2.55rem}.channel .words{flex:1;margin:0 .95rem}.channel .track{width:11.5rem;margin-top:.27rem;height:.2rem}.channel:focus .track{background:#0002}
.preview{min-width:0;overflow:auto}.art{position:relative;aspect-ratio:16/9;height:18.5rem;border-radius:1.2rem;padding:1.05rem}.art .station{position:absolute;left:1.05rem;right:1.05rem;bottom:1.05rem;justify-content:space-between}.preview>small{display:block;margin:1.15rem 0 .2rem}.preview h2,.schedule h2{font-size:2.05rem;line-height:1.15;letter-spacing:-.06rem}.preview .range{margin-top:1rem}.preview .range .track{flex:1}
.page{height:100%;display:flex;flex-direction:column}.page>.browser{flex:1;height:auto;min-height:0}.guideLayout{grid-template-columns:35.7% 1fr}.schedule{padding:1.8rem 2rem}.schedule{display:flex;flex-direction:column}.entries{min-height:0;overflow:auto}.schedule h2{margin:.25rem 0 1.15rem}.programme{width:100%;padding:.75rem 1rem;border-radius:.7rem;min-height:4.25rem}.programme .time{min-width:7.8rem;color:var(--muted);font:1.05rem monospace}.programme .words{flex:1}.programme .liveTag{margin-left:.4rem}.programme.current{background:#343539}.programme.past{opacity:.52}.schedule:focus{outline:2px solid var(--blue);outline-offset:-2px}.empty{color:var(--muted);margin:1.5rem .4rem}
input{background:#191c22;border:1px solid #42454e;border-radius:.65rem;padding:.8rem 1rem}input:focus{outline:2px solid var(--blue)}#search{width:60%;margin:0 0 .8rem}
#player,.overlay{position:fixed;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;z-index:5;background:black}#video{width:100%;height:100%;object-fit:contain}#playerbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;padding:2rem 4rem;background:linear-gradient(transparent,#08090bef)}#playerbar button{margin-left:.5rem}#playerbar.hidden{opacity:0;pointer-events:none}#playingTitle{margin-right:auto}#playerError{position:absolute;top:12%;background:#532531;padding:.8rem;border-radius:.6rem;display:none}
.overlay{z-index:8;background:#060709e8}.dialog{width:44rem;max-height:90vh;overflow:auto;padding:2.2rem}.dialog h2{font-size:2rem;margin-bottom:1rem}.dialog label,.dialog input{display:block;width:100%}.dialog label{margin:.8rem 0 .4rem;color:var(--muted)}.dialog .actions{flex-wrap:wrap}.dialog .actions button{margin:.3rem .45rem .3rem 0}.guide-list{max-height:50vh;overflow:auto}.guide-row{padding:.5rem}.guide-row>*{display:block}#toast{position:fixed;z-index:12;left:50%;bottom:2%;transform:translateX(-50%);background:#25262c;color:#fff;border-radius:2rem;padding:.5rem 1.1rem;display:none}
</style>
<!-- standalone Samsung scripts -->
</head>
<body>
<div id="app">
<header><div class="brand"><span class="mark"></span>Vistaar</div>
<nav id="tabs" aria-label="TV navigation"><button data-view="search" aria-label="Search"><span class="searchIcon"></span></button><button data-view="home">Home</button><button data-view="live">Live TV</button><button data-view="guide">Guide</button><button data-view="favourites">Favourites</button></nav>
<div class="tools"><span id="clock" class="clock"></span><button class="circle" id="refresh" aria-label="Refresh channels">⟳</button><button class="circle" id="settingsOpen" aria-label="Settings">⚙</button></div></header>
<main><div id="stage"></div></main><span id="status" role="status" hidden></span></div>
<div id="player"><video id="video" autoplay></video><div id="playerError"></div><div id="playerbar"><div id="playingTitle">Playing</div><button id="playPause">Play / pause</button><button id="prevChannel">◀ Channel</button><button id="nextChannel">Channel ▶</button><button id="guideCurrent">Guide</button><button id="aspect">Fit</button><button id="favCurrent">☆ Favourite</button><button id="closePlayer">Close</button></div></div>
<div class="overlay" id="settings"><div class="dialog"><h2>Vistaar settings</h2><p>Use playlists and guide feeds you are authorised to access. Some providers block browser requests (CORS) or use formats/DRM unsupported by your TV browser.</p><label for="playlistUrl">M3U / M3U8 playlist URL</label><input id="playlistUrl" type="url" placeholder="https://example.com/playlist.m3u"><label for="epgUrl">Optional XMLTV guide URL</label><input id="epgUrl" type="url" placeholder="https://example.com/guide.xml"><div class="actions"><button id="loadIndia">Load India free playlist</button><button id="importFile">Import M3U file</button><button id="cancelSettings">Cancel</button><button class="primary" id="saveSettings">Save &amp; load</button></div><input id="fileInput" type="file" accept=".m3u,.m3u8,text/plain" hidden><p id="settingsMessage" class="smallnote"></p><hr style="border-color:#293b55"><div class="actions"><button id="clearData">Clear local favourites/history</button></div></div></div>
<div class="overlay" id="guide"><div class="dialog"><h2 id="guideTitle">Programme guide</h2><p>Programme data appears when an XMLTV feed is configured and contains matching channel IDs.</p><div class="guide-list" id="guideList"></div><div class="actions"><button id="closeGuide">Close</button></div></div></div><div id="toast"></div>
<script>
(function(){
'use strict';
const INDIA='https://iptv-org.github.io/iptv/countries/in.m3u';
const $=id=>document.getElementById(id);
const nativePlayer=window.vistaarPlayer;
if(nativePlayer){
 const surface=document.createElement('object');
 surface.type='application/avplayer';
 surface.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none';
 $('player').insertBefore(surface,$('video'));
 $('video').style.display='none';
}
let playbackRequest=0;
let guideOpener=null;
function activeLayer(){
 for(const id of ['guide','settings','player']){
   if($(id).style.display==='flex')return $(id);
 }
 return $('app');
}
const S={channels:[],view:'home',group:'All',query:'',favs:new Set(read('vistar:favs',[])),recent:read('vistar:recent',[]),epg:Object.create(null),current:null,aspect:0,playerTimer:null};
function read(k,d){try{const value=JSON.parse(localStorage.getItem(k));return value===null?d:value}catch(_){return d}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){toast('TV storage is full or unavailable')}}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>{$('toast').style.display='none'},2600)}
function validUrl(v){try{const u=new URL(v);return u.protocol==='https:'||u.protocol==='http:'}catch(_){return false}}
function parseM3U(src){const lines=String(src).replace(/^\uFEFF/,'').split(/\r?\n/),out=[];let meta=null;
 for(const raw of lines){const line=raw.trim();if(!line)continue;if(line.startsWith('#EXTINF:')){const match=/^(?:[^",]|"[^"]*")*/.exec(line),comma=line.charAt(match[0].length)===','?match[0].length:-1,head=comma<0?line:line.slice(0,comma);const attr=(k)=>{const m=head.match(new RegExp('(?:^|\\s)'+k+'="([^"]*)"','i'));return m?m[1]:''};meta={name:comma<0?'Unknown channel':line.slice(comma+1).trim(),group:attr('group-title')||'Other',language:attr('tvg-language'),logo:attr('tvg-logo'),id:attr('tvg-id')};}
 else if(!line.startsWith('#')&&validUrl(line)){const m=meta||{};out.push({id:(m.id||m.name||'ch'+out.length)+'|'+line,name:m.name||'Channel '+(out.length+1),order:out.length+1,language:m.language||'',group:m.group||'Other',logo:m.logo||'',tvgId:m.id||'',url:line,hd:/\b(4k|uhd|fhd|1080p?|720p?|hd)\b/i.test((m.name||'')+' '+line)});meta=null;}}
 return out;}
function classify(c){const g=(c.group||'').toLowerCase();if(/news/.test(g))return'News';if(/sport/.test(g))return'Sports';if(/movie|cinema|film/.test(g))return'Movies';if(/kid|child/.test(g))return'Kids';if(/music/.test(g))return'Music';if(/entertain|series|general/.test(g))return'Entertainment';return'Other'}
const stage=$('stage');
let selectedId='';
let selectedFilter='All';
let selectedRow=null;
let selectedChannel=null;
const logoObserver=window.IntersectionObserver && new IntersectionObserver(entries=>{
 for(const entry of entries)if(entry.isIntersecting){
   const img=entry.target;
   img.src=img.dataset.src;
   logoObserver.unobserve(img);
 }
});
function el(tag,cls,text){
 const node=document.createElement(tag);
 if(cls)node.className=cls;
 if(text!=null)node.textContent=text;
 return node;
}
function button(label,action,cls){
 const b=el('button',cls,label);
 b.onclick=action;
 return b;
}
function logo(ch){
 const box=el('span','logoBox',ch.name.replace(/[^a-z0-9 ]/gi,'').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'TV');
 if(validUrl(ch.logo)){
   const img=el('img');
   img.alt='';
   img.onerror=()=>img.remove();
   if(logoObserver){img.dataset.src=ch.logo;logoObserver.observe(img)}else img.src=ch.logo;
   box.append(img);
 }
 return box;
}
function words(title,sub){
 const node=el('div','words');
 node.append(el('strong','',title),el('small','',sub));
 return node;
}
function xmlTime(raw){
 const m=/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?\s*(?:([+-])(\d{2})(\d{2}))?$/.exec(raw||'');
 if(!m)return NaN;
 const offset=(Number(m[8]||0)*60+Number(m[9]||0))*(m[7]==='-'?-1:1);
 return Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))-offset*60000;
}
function timeLabel(n){
 const d=new Date(n),h=d.getHours();
 return (h%12||12)+':'+String(d.getMinutes()).padStart(2,'0')+(h<12?' am':' pm');
}
function scheduleFor(ch){return S.epg[ch.tvgId]||[]}
function currentShow(ch){const now=Date.now();return scheduleFor(ch).find(p=>p.begin<=now&&p.end>now)}
function track(p){
 const node=el('span','track'),fill=el('i');
 fill.style.width=Math.min(100,Math.max(0,(Date.now()-p.begin)*100/(p.end-p.begin)))+'%';
 node.append(fill);return node;
}
function range(p){
 const node=el('div','range');
 node.append(el('span','',timeLabel(p.begin)),track(p),el('span','',timeLabel(p.end)));
 return node;
}
function channelGroup(ch){return ch.language||ch.group||'Other'}
function badge(){return el('span','liveTag','LIVE')}
function favourite(ch){
 if(S.favs.has(ch.id))S.favs.delete(ch.id);else S.favs.add(ch.id);
 saveState();
 toast(S.favs.has(ch.id)?'Added to favourites':'Removed from favourites');
}
function star(ch){
 const b=button(S.favs.has(ch.id)?'★':'☆',()=>{
   favourite(ch);b.textContent=S.favs.has(ch.id)?'★':'☆';
   if(S.view==='favourites'){drawList();focusFirst()}
 },'circle');
 b.setAttribute('aria-label','Favourite '+ch.name);return b;
}
function art(node,ch){
 const colors=['#79441e','#7d5a49','#655789','#28678a','#4f6457','#714659'];
 node.style.setProperty('--glow',colors[(ch.order-1)%colors.length]);
}
function setView(v,ch){
 S.view=v;S.group='All';selectedFilter='All';S.query='';
 if(ch)selectedId=ch.id;
 render();
 focusFirst();
}
function setup(){
 const wrap=el('section','setup-layout'),intro=el('div'),panel=el('div','setup-panel');
 intro.append(el('h1','','Set up your TV'),el('p','','Watch free Indian channels or connect your own playlist.'));
 panel.append(el('h2','','Choose your channels'),
   button('Load free India channels',()=>{settingsOpen();$('loadIndia').click()}),
   button('Add a playlist',settingsOpen),
   el('small','','M3U playlists and XMLTV programme guides are supported.'));
 wrap.append(intro,panel);stage.append(wrap);
}
function home(){
 const ch=S.channels.find(c=>c.id===S.recent[0])||S.channels[0];
 const p=currentShow(ch),next=scheduleFor(ch).find(q=>q.begin>Date.now());
 const hero=el('section','homeHero'),line=el('div','brandline'),actions=el('div','actions');
 line.append(logo(ch),el('strong','',ch.name),el('small','',ch.order));hero.append(line,el('h1','',p?p.title:ch.name));
 if(next)hero.append(el('h3','','Up next: '+next.title+' at '+timeLabel(next.begin)));
 const info=el('div','badgeline');info.append(badge(),el('strong','',p?'Until '+timeLabel(p.end)+'  ·  '+Math.ceil((p.end-Date.now())/60000)+' min left':channelGroup(ch)));hero.append(info);
 if(p&&p.desc)hero.append(el('p','description',p.desc));
 if(p)hero.append(range(p));
 actions.append(button('▸  Watch Live',()=>play(ch)),button('Guide',()=>setView('guide',ch)),star(ch));hero.append(actions);
 stage.append(hero,el('h2','railTitle','Channels for you'));
 const rail=el('div','rail');
 const ordered=new Set([...S.recent,...S.favs,...S.channels.map(c=>c.id)]);
 const byId=new Map(S.channels.map(c=>[c.id,c]));
 for(const id of ordered){
   const c=byId.get(id);if(!c)continue;
   const show=currentShow(c),tile=button('',()=>play(c),'tile'),station=el('div','station');
   tile.dataset.channel=c.id;art(tile,c);
   station.append(logo(c),words(show?show.title:c.name,show?c.name+' · until '+timeLabel(show.end):channelGroup(c)));
   tile.append(badge(),station);rail.append(tile);
   if(rail.children.length===24)break;
 }
 stage.append(rail);
}
function updateDetails(ch){
 const pane=$('details');if(!pane)return;
 pane.textContent='';const p=currentShow(ch);
 if(S.view==='guide'){
   pane.append(el('small','',ch.order+'  ·  '+channelGroup(ch)),el('h2','',ch.name));
   const shows=scheduleFor(ch);
   if(!shows.length){pane.append(el('p','empty','No programme guide for this channel.'),button('Guide settings',settingsOpen));return}
   const first=Math.max(0,shows.findIndex(q=>q.end>Date.now())-1);
   const entries=el('div','entries');
   for(const q of shows){
     const line=el('div','programme'+(q===p?' current':q.end<=Date.now()?' past':''));
     line.append(el('span','time',timeLabel(q.begin)),words(q.title,q.desc));if(q===p)line.append(badge());
     entries.append(line);
   }
   pane.append(entries);
   entries.scrollTop=entries.children[first].offsetTop-entries.children[0].offsetTop;return;
 }
 const banner=el('div','art'),station=el('div','station');art(banner,ch);
 station.append(logo(ch),el('small','',channelGroup(ch)+(ch.hd?' · HD':'')));banner.append(badge(),station);
 pane.append(banner,el('small','',ch.name+' · '+ch.order),el('h2','',p?p.title:ch.name));
 if(p){pane.append(el('small','','Live · until '+timeLabel(p.end)),range(p));if(p.desc)pane.append(el('p','description',p.desc))}
 const actions=el('div','actions');actions.append(button('▸  Watch',()=>play(ch)),button('Schedule',()=>setView('guide',ch)),star(ch));pane.append(actions);
}
function channelRow(ch){
 const b=button('',()=>play(ch),'channel'),p=currentShow(ch);
 b.dataset.channel=ch.id;
 const text=words(ch.name,p?p.title:channelGroup(ch));if(p&&S.view!=='guide')text.append(track(p));
 b.append(el('span','number',ch.order),logo(ch),text);if(S.view!=='guide')b.append(badge());
 b.onfocus=()=>{
   if(selectedRow)selectedRow.classList.remove('selected');
   selectedRow=b;selectedChannel=ch;selectedId=ch.id;b.classList.add('selected');updateDetails(ch);
 };
 return b;
}
function drawList(){
 const root=$('channels'),pane=$('details');if(!root)return;
 if(logoObserver)logoObserver.disconnect();
 root.textContent='';pane.textContent='';selectedRow=null;selectedChannel=null;
 let list=S.channels;
 if(S.view==='favourites')list=list.filter(c=>S.favs.has(c.id));
 if(selectedFilter==='HD')list=list.filter(c=>c.hd);
 else if(selectedFilter==='Free TV')list=list.filter(c=>c.free);
 else if(selectedFilter==='Recently watched')list=S.recent.map(id=>list.find(c=>c.id===id)).filter(Boolean);
 else if(selectedFilter!=='All')list=list.filter(c=>'group:'+channelGroup(c)===selectedFilter);
 if(S.query)list=list.filter(c=>(c.name+' '+channelGroup(c)).toLowerCase().includes(S.query));
 if(!list.length){root.append(el('p','empty',S.view==='favourites'?'Save a channel with the star to see it here.':'No matching channels.'));return}
 const frag=document.createDocumentFragment();
 for(const ch of list){
   const row=channelRow(ch);frag.append(row);
   if(ch.id===selectedId||!selectedRow){selectedRow=row;selectedChannel=ch}
 }
 root.append(frag);selectedRow.classList.add('selected');selectedId=selectedChannel.id;updateDetails(selectedChannel);
}
function renderBrowser(){
 const page=el('section','page');
 if(S.view!=='live')page.append(el('h1','pageTitle',({guide:'Guide',search:'Search',favourites:'Favourites'})[S.view]));
 if(S.view==='search'){
   const search=el('input');search.id='search';search.type='search';search.placeholder='Search channels';search.setAttribute('aria-label','Search channels');search.value=S.query;
   search.oninput=()=>{S.query=search.value.trim().toLowerCase();drawList()};page.append(search);
 }
 const guide=S.view==='guide',columns=el('div','browser'+(guide?' guideLayout':''));
 if(!guide){
   const filters=el('aside','filters'),counts=new Map();
   const source=S.view==='favourites'?S.channels.filter(c=>S.favs.has(c.id)):S.channels;
   for(const ch of source){const k=channelGroup(ch);counts.set(k,(counts.get(k)||0)+1)}
   function add(key,label,count){
     const b=button('',()=>{
       selectedFilter=key;
       filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));drawList();
     });b.classList.toggle('active',key===selectedFilter);b.append(el('span','',label),el('small','',count));filters.append(b);
   }
   add('All','All channels',source.length);
   Array.from(counts).sort((a,b)=>b[1]-a[1]).forEach(pair=>add('group:'+pair[0],pair[0],pair[1]));
   if(S.view==='live'){add('HD','HD',source.filter(c=>c.hd).length);add('Free TV','Free TV',source.filter(c=>c.free).length);add('Recently watched','Recently watched',S.recent.length)}
   columns.append(filters);
 }
 const rows=el('div','list'),pane=el('section',guide?'schedule':'preview');
 rows.id='channels';pane.id='details';if(guide)pane.tabIndex=0;
 columns.append(rows,pane);page.append(columns);stage.append(page);drawList();
}
function render(){
 if(logoObserver)logoObserver.disconnect();
 stage.textContent='';selectedRow=null;selectedChannel=null;
 const empty=!S.channels.length;
 $('app').className=empty?'setup':S.view==='home'?'home':'';
 $('tabs').hidden=empty;
 document.querySelectorAll('nav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===S.view));
 if(empty)setup();else if(S.view==='home')home();else renderBrowser();
}
function focusFirst(){
 const node=$('search')||selectedRow||stage.querySelector('button')||$('tabs').querySelector('button');
 if(node)node.focus();
}
function saveState(){write('vistar:favs',[...S.favs]);write('vistar:recent',S.recent.slice(0,40))}
async function fetchText(url){if(!validUrl(url))throw Error('Enter a valid HTTP or HTTPS URL');const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('Server returned HTTP '+r.status);return await r.text()}
async function loadPlaylist(url,free){$('settingsMessage').textContent='Loading playlist…';try{const text=await fetchText(url),parsed=parseM3U(text);if(!parsed.length)throw Error('No valid stream URLs found in this playlist');S.channels=parsed.map(c=>({...c,free:!!free}));write('vistar:playlist',url);S.view='home';selectedFilter='All';S.query='';$('settings').style.display='none';$('status').textContent=parsed.length+' channels';render();focusFirst();toast('Loaded '+parsed.length+' channels')}catch(e){$('settingsMessage').textContent='Could not load playlist: '+e.message+'. Check URL, network and CORS permissions.';$('status').textContent='Playlist unavailable';if(activeLayer()===$('app'))toast('Could not restore playlist. Open Settings to retry.')}}
let guideRequest=0;
async function loadEpg(url){
 const request=++guideRequest;
 S.epg=Object.create(null);
 if(!url)return;
 try{
   const xml=await fetchText(url),doc=new DOMParser().parseFromString(xml,'text/xml');
   if(request!==guideRequest)return;
   if(doc.querySelector('parsererror'))throw Error('Invalid XMLTV document');
   for(const entry of doc.querySelectorAll('programme')){
     const id=entry.getAttribute('channel'),begin=xmlTime(entry.getAttribute('start')),end=xmlTime(entry.getAttribute('stop'));
     if(!id||!Number.isFinite(begin)||!(end>begin))continue;
     if(!S.epg[id])S.epg[id]=[];
     S.epg[id].push({begin,end,start:timeLabel(begin),stop:timeLabel(end),title:(entry.querySelector('title')||{}).textContent||'Programme',desc:(entry.querySelector('desc')||{}).textContent||''});
   }
   Object.keys(S.epg).forEach(id=>S.epg[id].sort((a,b)=>a.begin-b.begin));
   if(S.view==='home'||S.view==='guide'||S.view==='live')refreshView();
   toast('Guide loaded');
 }catch(e){if(request===guideRequest)toast('Guide unavailable: '+e.message)}
}
function refreshView(){
 if(!S.channels.length||activeLayer()!==$('app')||S.view==='search')return;
 const active=document.activeElement;
 const hadFocus=stage.contains(active),id=active.dataset.channel,text=active.textContent;
 const list=$('channels'),scroll=list&&list.scrollTop;
 render();
 if($('channels')&&scroll)$('channels').scrollTop=scroll;
 if(hadFocus){
   const buttons=Array.from(stage.querySelectorAll('button'));
   const next=buttons.find(b=>id?b.dataset.channel===id:b.textContent===text);
   if(next)next.focus();else focusFirst();
 }
}
function openGuide(ch){guideOpener=document.activeElement;$('guideTitle').textContent=ch?'Guide · '+ch.name:'Programme guide';const root=$('guideList');root.textContent='';let matches=[];if(ch)matches=S.epg[ch.tvgId]||[];else S.channels.forEach(c=>(S.epg[c.tvgId]||[]).forEach(p=>matches.push({...p,channel:c.name})));if(!matches.length){const p=document.createElement('p');p.textContent='No matching programme data. Add an XMLTV URL and ensure its channel IDs match your playlist tvg-id values.';root.append(p)}else matches.slice(0,100).forEach(p=>{const d=document.createElement('div');d.className='guide-row';const b=document.createElement('b');b.textContent=(p.channel?p.channel+' · ':'')+p.title;const s=document.createElement('span');s.textContent=[p.start,p.stop].filter(Boolean).join(' – ');d.append(b,s);if(p.desc){const q=document.createElement('p');q.textContent=p.desc;d.append(q)}root.append(d)});$('guide').style.display='flex';$('closeGuide').focus()}
function showPlayerBar(){ $('playerbar').classList.remove('hidden');clearTimeout(S.playerTimer);S.playerTimer=setTimeout(()=>{$('playerbar').classList.add('hidden')},5000)}
function playerError(msg){$('playerError').textContent=msg;$('playerError').style.display='block'}
function play(c){
 const request=++playbackRequest;
 S.current=c;
 S.recent=[c.id,...S.recent.filter(x=>x!==c.id)].slice(0,40);
 saveState();
 $('playingTitle').textContent=c.name;
 $('favCurrent').textContent=S.favs.has(c.id)?'★ Saved':'☆ Favourite';
 $('playerError').style.display='none';
 $('player').style.display='flex';
 if(nativePlayer){
   nativePlayer.open(c.url,S.aspect,playerError);
 }else{
   const video=$('video');
   video.src=c.url;
   video.load();
   const pending=video.play();
   if(pending)pending.catch(()=>{
     if(request===playbackRequest)playerError('Playback did not start. Press Play to retry or choose another channel.');
   });
 }
 render();
 showPlayerBar();
 $('playPause').focus();
}
function closePlayer(){
 const last=S.current;
 ++playbackRequest;
 if(nativePlayer)nativePlayer.close();
 else{
   const video=$('video');
   video.pause();
   video.removeAttribute('src');
   video.load();
 }
 $('player').style.display='none';
 S.current=null;
 clearTimeout(S.playerTimer);
 const card=Array.from(stage.querySelectorAll('[data-channel]')).find(el=>last&&el.dataset.channel===last.id);
 if(card)card.focus();else focusFirst();
}
function controlPlayback(action){
 if(!S.current)return;
 if($('playerError').style.display==='block'&&action!=='pause'){play(S.current);return}
 if(nativePlayer){try{nativePlayer.control(action)}catch(_){playerError('Could not change playback. Press Play to retry.')}return}
 const video=$('video');
 if(action==='play'||(action==='toggle'&&video.paused)){
   const request=playbackRequest;
   const pending=video.play();
   if(pending)pending.catch(()=>{if(request===playbackRequest)playerError('Press Play to retry or choose another channel.')});
 }else video.pause();
}
function changeChannel(delta){const i=S.channels.findIndex(c=>S.current&&c.id===S.current.id);const next=S.channels[i+delta];if(next)play(next)}
function toggleFav(){if(!S.current)return;const id=S.current.id;if(S.favs.has(id))S.favs.delete(id);else S.favs.add(id);saveState();$('favCurrent').textContent=S.favs.has(id)?'★ Saved':'☆ Favourite';render();toast(S.favs.has(id)?'Added to favourites':'Removed from favourites')}
function readFile(file) {
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>resolve(reader.result);
   reader.onerror=()=>reject(Error('Could not read playlist file'));
   reader.readAsText(file);
 });
}
function settingsOpen(){$('playlistUrl').value=read('vistar:playlist','');$('epgUrl').value=read('vistar:epg','');$('settings').style.display='flex';$('playlistUrl').focus()}


document.querySelectorAll('button[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('refresh').onclick=async()=>{
 const url=read('vistar:playlist','');
 if(!url){settingsOpen();return}
 await loadPlaylist(url,url===INDIA);
 await loadEpg(read('vistar:epg',''));
};
$('clock').textContent=timeLabel(Date.now());
setInterval(()=>{$('clock').textContent=timeLabel(Date.now());refreshView()},60000);
$('settingsOpen').onclick=settingsOpen;$('cancelSettings').onclick=()=>{$('settings').style.display='none';$('settingsOpen').focus()};
$('saveSettings').onclick=async()=>{const u=$('playlistUrl').value.trim(),g=$('epgUrl').value.trim();if(!validUrl(u)){$('settingsMessage').textContent='Enter a valid playlist URL.';return}write('vistar:epg',g);await loadPlaylist(u,false);await loadEpg(g)};
$('loadIndia').onclick=()=>{ $('playlistUrl').value=INDIA; loadPlaylist(INDIA,true); };$('importFile').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=parseM3U(await readFile(f));if(!parsed.length)throw Error('No valid stream URLs');S.channels=parsed.map(c=>({...c,free:false}));S.view='home';selectedFilter='All';S.query='';$('settings').style.display='none';render();focusFirst();toast('Imported '+parsed.length+' channels')}catch(err){$('settingsMessage').textContent=err.message}};
$('clearData').onclick=()=>{S.favs.clear();S.recent=[];saveState();render();toast('Favourites and history cleared')};
$('playPause').onclick=()=>controlPlayback('toggle');$('closePlayer').onclick=closePlayer;$('favCurrent').onclick=toggleFav;$('prevChannel').onclick=()=>changeChannel(-1);$('nextChannel').onclick=()=>changeChannel(1);$('guideCurrent').onclick=()=>openGuide(S.current);
$('aspect').onclick=()=>{S.aspect=(S.aspect+1)%3;const modes=['contain','cover','fill'],labels=nativePlayer?['Fit','Auto','Stretch']:['Fit','Zoom','Stretch'];if(nativePlayer){try{nativePlayer.aspect(S.aspect)}catch(_){toast('Aspect unavailable')}}else $('video').style.objectFit=modes[S.aspect];$('aspect').textContent=labels[S.aspect]};
$('closeGuide').onclick=()=>{$('guide').style.display='none';if(guideOpener&&guideOpener.isConnected)guideOpener.focus();else focusFirst();if(S.current)showPlayerBar()};
function moveFocus(direction){const nodes=[...activeLayer().querySelectorAll('button:not(:disabled),input:not(:disabled),[tabindex="0"]')].filter(el=>el.getClientRects().length&&el.offsetParent!==null);const current=document.activeElement;if(!nodes.includes(current)){if(nodes.length)nodes[0].focus();return}const a=current.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;let best=null,bestScore=Infinity;for(const el of nodes){if(el===current)continue;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,dx=x-ax,dy=y-ay;const primary=direction==='left'?-dx:direction==='right'?dx:direction==='up'?-dy:dy;if(primary<=2)continue;const cross=direction==='left'||direction==='right'?Math.abs(dy):Math.abs(dx);const score=primary+cross*2.2;if(score<bestScore){bestScore=score;best=el}}if(best)best.focus()}
document.addEventListener('keydown',e=>{
 const codes={37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown',13:'Enter',10009:'BrowserBack',
   427:'ChannelUp',428:'ChannelDown',415:'MediaPlay',19:'MediaPause',10252:'MediaPlayPause',413:'MediaStop'};
 const key=codes[e.keyCode]||e.key||'';
 const layer=activeLayer();
 const input=document.activeElement.tagName==='INPUT';
 if(key==='BrowserBack'||key==='Escape'||(key==='Backspace'&&!input)){
   if(layer===$('guide'))$('closeGuide').click();
   else if(layer===$('settings'))$('cancelSettings').click();
   else if(layer===$('player'))closePlayer();
   else if(S.view!=='home'){setView('home');focusFirst()}
   else if(window.tizen&&window.tizen.application)window.tizen.application.getCurrentApplication().exit();
   else return;
   e.preventDefault();
   return;
 }
 // Some TV remotes send Enter without generating a button click.
 const focused=document.activeElement;
 if(key==='Enter'&&focused.tagName==='BUTTON'&&layer.contains(focused)){
   e.preventDefault();
   if(e.repeat)return;
   if(layer===$('player')){
     const barWasHidden=$('playerbar').classList.contains('hidden');
     showPlayerBar();
     if(barWasHidden){$('playPause').focus();return}
   }
   focused.click();
   return;
 }
 if(layer===$('player')){
   const hidden=$('playerbar').classList.contains('hidden');
   showPlayerBar();
   if(key==='ChannelUp'||key==='ChannelDown')changeChannel(key==='ChannelUp'?1:-1);
   else if(key==='MediaStop')closePlayer();
   else if(key==='MediaPlay'||key==='MediaPause'||key==='MediaPlayPause')
     controlPlayback({MediaPlay:'play',MediaPause:'pause',MediaPlayPause:'toggle'}[key]);
   else if(hidden&&key==='Enter')$('playPause').focus();
   else if(!key.startsWith('Arrow'))return;
   if(!key.startsWith('Arrow')){e.preventDefault();return}
 }
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)){
   if(document.activeElement===$('details')&&S.view==='guide'&&(key==='ArrowUp'||key==='ArrowDown')){
     const entries=$('details').querySelector('.entries');
     if(entries){e.preventDefault();entries.scrollTop+=(key==='ArrowDown'?1:-1)*entries.clientHeight/2;return}
   }
   if(input&&(key==='ArrowLeft'||key==='ArrowRight')&&document.activeElement.value)return;
   e.preventDefault();
   moveFocus(key.slice(5).toLowerCase());
 }else if(key==='Enter'&&document.activeElement===document.body)focusFirst();
});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden&&S.current){if(activeLayer()===$('guide'))$('closeGuide').click();closePlayer()}
});
$('video').addEventListener('error',()=>playerError('This stream format or codec may not be supported by the TV browser, or the stream may be unavailable.'));
$('video').addEventListener('playing',()=>$('playerError').style.display='none');
render();focusFirst();
const saved=read('vistar:playlist','');const savedEpg=read('vistar:epg','');if(saved){$('status').textContent='Restoring saved playlist…';loadPlaylist(saved,saved===INDIA).then(()=>{if(savedEpg)loadEpg(savedEpg)});}else{$('status').textContent='Ready'}
if(!('fetch'in window))toast('This TV browser may be too old for playlist loading');
})();
</script>
</body></html>
